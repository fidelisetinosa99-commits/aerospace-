<!DOCTYPE html>
<html>
<head>
<title>Agbor Aerospace - Fidelis Etinosa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0a1f44;color:white;text-align:center}
.logo{width:180px;margin-top:20px;background:white;border-radius:50%;padding:10px}
h1{color:#ff8c00;margin:10px 0}
#map{height:400px;width:92%;margin:20px auto;border:3px solid #ff8c00;border-radius:15px}
.controls{background:white;padding:15px}
select,button{padding:12px;margin:5px;border-radius:8px;font-weight:bold}
button{background:#ff8c00;color:white;border:none}
.footer{padding:20px;background:#06122a;font-size:14px}
a{color:#ff8c00}
</style>
</head>
<body>
<img src="logo.png" class="logo" alt="Agbor Aerospace Logo">
<h1>AGBOR AEROSPACE</h1>
<p><b>Fidelis Etinosa</b><br>fidelisetinosa99@gmail.com<br>Agbor, Delta State, Nigeria</p>
<p style="color:#ccc">Solving Network • Communication • Power with Aerospace Tech</p>

<div class="controls">
<select id="net"><option>MTN</option><option>Airtel</option><option>Glo</option><option>9mobile</option></select>
<select id="spd"><option value="5">Excellent</option><option value="4">Good</option><option value="3">Average</option><option value="2">Poor</option></select>
<button onclick="addMode=true;alert('Tap map to add point')">📍 Add Network Point</button>
</div>

<div id="map"></div>

<div class="footer">
© 2026 Agbor Aerospace | Built by Fidelis Etinosa (13) | <a href="mailto:fidelisetinosa99@gmail.com">Contact Me</a>
</div>

<script>
var map = L.map('map').setView([6.252, 6.194], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var addMode=false; var colors={2:'red',3:'orange',4:'yellow',5:'green'};
map.on('click',e=>{
 if(!addMode)return;
 var n=document.getElementById('net').value; var s=document.getElementById('spd').value;
 L.circleMarker(e.latlng,{radius:11,color:colors[s],fillColor:colors[s],fillOpacity:0.8}).addTo(map).bindPopup(n).openPopup();
 addMode=false;
});
</script>
</body>
</html>
